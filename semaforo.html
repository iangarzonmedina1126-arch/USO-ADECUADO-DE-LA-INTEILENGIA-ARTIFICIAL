<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🚦 Semáforo de la IA</title>

<style>
body{
    font-family: 'Segoe UI', Arial;
    margin: 0;
    padding: 0;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

header{
    padding: 30px;
}

h1{
    font-size: 36px;
}

.subtitulo{
    font-size: 18px;
    opacity: 0.85;
}

.contenedor{
    max-width: 850px;
    margin: 30px auto;
    padding: 35px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

#pregunta{
    font-size: 24px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.boton{
    display: inline-block;
    margin: 15px;
    padding: 16px 28px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    transition: 0.3s;
}

.rojo{
    background: #e53935;
}

.amarillo{
    background: #fbc02d;
    color: #222;
}

.verde{
    background: #43a047;
}

.boton:hover{
    transform: scale(1.08);
}

#resultado{
    margin-top: 25px;
    font-size: 22px;
    font-weight: bold;
}

#puntaje{
    margin-top: 20px;
    font-size: 20px;
    color: #00e5ff;
}

.atras{
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 10px 18px;
    text-decoration: none;
    font-size: 14px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border-radius: 8px;
    color: white;
}

footer{
    margin-top: 40px;
    opacity: 0.7;
}
</style>
</head>
<body>

<a href="index.html" class="atras">⮌ Atrás</a>

<header>
    <h1>🚦 Semáforo de la IA</h1>
    <p class="subtitulo">
        Clasifica cada situación: ¿Mal uso🔴 , dudoso🟡  o buen uso 🟢 ?
    </p>
</header>

<div class="contenedor">

    <div id="pregunta">
        Cargando situación...
    </div>

    <button class="boton rojo" onclick="responder('rojo')">
        🔴 Rojo
    </button>

    <button class="boton amarillo" onclick="responder('amarillo')">
        🟡 Amarillo
    </button>

    <button class="boton verde" onclick="responder('verde')">
        🟢 Verde
    </button>

    <div id="resultado"></div>
    <div id="puntaje">Puntaje: 0</div>

</div>

<footer>
    <p>© 2026 Proyecto educativo</p>
</footer>

<script>
const preguntas = [
{
texto: "Un estudiante usa IA para resumir un libro que sí leyó completo antes.",
respuesta: "amarillo"
},
{
texto: "Una empresa usa IA para revisar hojas de vida, pero un humano toma la decisión final.",
respuesta: "verde"
},
{
texto: "Una persona publica una imagen creada con IA sin aclarar que no es real.",
respuesta: "rojo"
},
{
texto: "Un médico consulta una IA para tener una segunda opinión antes de diagnosticar.",
respuesta: "amarillo"
},
{
texto: "Un profesor usa IA para crear ejercicios personalizados para sus estudiantes.",
respuesta: "verde"
},
{
texto: "Una persona usa IA para responder mensajes importantes sin revisar lo que envía.",
respuesta: "amarillo"
},
{
texto: "Un creador de contenido usa IA para imitar la voz de otra persona sin permiso.",
respuesta: "rojo"
}
];

let indice = 0;
let puntos = 0;

function cargarPregunta(){
    document.getElementById("pregunta").innerText =
        preguntas[indice].texto;
    document.getElementById("resultado").innerText = "";
}

function responder(color){
    if(color === preguntas[indice].respuesta){
        document.getElementById("resultado").innerText =
            "✅ Buena clasificación";
        puntos++;
    } else {
        document.getElementById("resultado").innerText =
            "❌ No era esa opción";
    }

    document.getElementById("puntaje").innerText =
        "Puntaje: " + puntos;

    indice++;

    if(indice < preguntas.length){
        setTimeout(cargarPregunta, 1500);
    } else {
        setTimeout(function(){
            document.getElementById("pregunta").innerText =
                "🏆 Juego terminado. Puntaje final: " + puntos + " de " + preguntas.length;
            document.getElementById("resultado").innerText = "";
        }, 1500);
    }
}

cargarPregunta();
</script>

</body>
</html>
