<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>⚖️ Ruleta del Tribunal de la IA</title>

<style>
body{
    font-family: 'Segoe UI', Arial;
    margin: 0;
    padding: 0;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
}

header{
    padding: 30px;
}

h1{
    font-size: 36px;
}

.subtitulo{
    font-size: 18px;
    opacity: 0.85;
}

.contenedor{
    max-width: 950px;
    margin: 30px auto;
    padding: 35px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* RULETA */
.ruleta {
    width: 180px;
    height: 180px;
    margin: 20px auto;
    border-radius: 50%;
    border: 8px solid #ffd54f;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 60px;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 25px rgba(255,213,79,0.3);
    transition: transform 2s ease;
}

.girar {
    transform: rotate(1080deg);
}

#caso {
    margin-top: 30px;
    font-size: 22px;
    line-height: 1.7;
    min-height: 130px;
}

.boton {
    display: inline-block;
    margin: 15px;
    padding: 16px 28px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    transition: 0.3s;
}

.girar-btn {
    background: linear-gradient(45deg, #ffd54f, #ff9800);
    color: white;
}

.etico {
    background: #2e7d32;
}

.dudoso {
    background: #f9a825;
    color: #222;
}

.noetico {
    background: #c62828;
}

.boton:hover {
    transform: scale(1.08);
}

#resultado {
    margin-top: 25px;
    font-size: 22px;
    font-weight: bold;
}

#puntaje {
    margin-top: 20px;
    font-size: 20px;
    color: #00e5ff;
}

.atras {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 10px 18px;
    text-decoration: none;
    font-size: 14px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border-radius: 8px;
    color: white;
}

footer {
    margin-top: 40px;
    opacity: 0.7;
}
</style>
</head>
<body>

<a href="index.html" class="atras">⮌ Atrás</a>

<header>
    <h1>⚖️ Ruleta del Tribunal de la IA</h1>
    <p class="subtitulo">
        Gira la ruleta y enfrenta casos donde decidir no será fácil
    </p>
</header>

<div class="contenedor">

    <div id="ruleta" class="ruleta">⚖️</div>

    <button class="boton girar-btn" onclick="girarRuleta()">
        🎯 Girar Ruleta
    </button>

    <div id="caso">
        Presiona "Girar Ruleta" para recibir un caso.
    </div>

    <button class="boton etico" onclick="responder('etico')">
        ✅ Ético
    </button>

    <button class="boton dudoso" onclick="responder('dudoso')">
        ⚠️ Dudoso
    </button>

    <button class="boton noetico" onclick="responder('noetico')">
        ❌ No Ético
    </button>

    <div id="resultado"></div>
    <div id="puntaje">Juicios acertados: 0</div>

</div>

<footer>
    <p>© 2026 - Proyecto educativo</p>
</footer>

<script>
const casos = [
{
texto: "Un hospital usa IA para decidir qué paciente recibe primero un trasplante urgente.",
respuesta: "dudoso"
},
{
texto: "Una empresa usa IA para despedir empleados sin escuchar su situación personal.",
respuesta: "noetico"
},
{
texto: "La policía usa IA para predecir delitos y vigilar ciertas zonas.",
respuesta: "dudoso"
},
{
texto: "Una universidad usa IA para detectar plagio revisando trabajos antiguos sin avisar.",
respuesta: "dudoso"
},
{
texto: "Un médico usa IA como apoyo, pero él toma la decisión final.",
respuesta: "etico"
},
{
texto: "Una persona recrea con IA la voz de un familiar fallecido para consolar a su familia.",
respuesta: "dudoso"
},
{
texto: "Una red social usa IA para mostrar noticias que atrapen más al usuario.",
respuesta: "noetico"
}
];

let casoActual = null;
let puntos = 0;

function girarRuleta() {
    const ruleta = document.getElementById("ruleta");
    ruleta.classList.add("girar");

    document.getElementById("resultado").innerText = "";

    setTimeout(() => {
        ruleta.classList.remove("girar");

        const random = Math.floor(Math.random() * casos.length);
        casoActual = casos[random];

        document.getElementById("caso").innerText = casoActual.texto;
    }, 2000);
}

function responder(opcion) {
    if (!casoActual) {
        document.getElementById("resultado").innerText =
            "🎯 Primero debes girar la ruleta";
        return;
    }

    if (opcion === casoActual.respuesta) {
        document.getElementById("resultado").innerText =
            "⚖️ Buen juicio";
        puntos++;
    } else {
        document.getElementById("resultado").innerText =
            "🧠 Caso complejo... piensa otra vez";
    }

    document.getElementById("puntaje").innerText =
        "Juicios acertados: " + puntos;
}
</script>

</body>
</html>
